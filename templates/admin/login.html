{% extends "base.html" %}

{% block title %}Admin Login - QR Attendance{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-purple">
                <i class="fa-solid fa-user-shield me-2"></i> System Administrator Login
            </div>
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div style="font-size: 2.75rem; color: var(--purple); margin-bottom: 0.5rem;">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h3>Admin Console</h3>
                    <p class="text-muted" style="font-size: 0.9rem;">
                        Authenticate to manage faculty, students, and attendance sessions.
                    </p>
                </div>

                <form method="POST" action="{{ url_for('admin_login') }}">
                    <div class="form-group mb-3">
                        <label class="form-label" for="username"><i class="fa-solid fa-user me-1 text-muted"></i> Admin Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin" required autofocus>
                    </div>

                    <div class="form-group mb-4">
                        <label class="form-label" for="password"><i class="fa-solid fa-lock me-1 text-muted"></i> Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-purple btn-lg w-100 mb-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Login to Console
                    </button>
                </form>

            </div>
            <div class="card-footer text-center" style="padding: 0.75rem; background: var(--gray-50); border-top: 1px solid var(--border-color); font-size: 0.85rem;">
                <a href="{{ url_for('index') }}" class="text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Back to Main Portal</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
