{% extends "base.html" %}

{% block title %}Student Login - QR Attendance{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h3><i class="fa-solid fa-user-graduate me-2"></i> Student Login</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('student_login', next=next) }}">
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" name="student_id" placeholder="e.g. MCA2026001" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Login to Student Portal
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('index') }}" class="text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Back to Main Portal</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
